name: busster
description: "An original bus parking jam puzzle game for Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  audioplayers: 6.7.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/dispatch.wav
    - assets/audio/boarding.wav
    - assets/audio/depot_clear.wav
    - assets/audio/stuck.wav
    - assets/levels/jam_levels.json
